naftiko: 1.0.0-alpha2
info:
  label: Ashby API — Interview Plan
  description: 'Ashby API — Interview Plan. 1 operations. Lead operation: interviewPlan.list. Self-contained Naftiko capability
    covering one Ashby business surface.'
  tags:
  - Ashby
  - Interview Plan
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ASHBY_API_KEY: ASHBY_API_KEY
capability:
  consumes:
  - type: http
    namespace: ashby-interview-plan
    baseUri: https://api.ashbyhq.com
    description: Ashby API — Interview Plan business capability. Self-contained, no shared references.
    resources:
    - name: interviewPlan.list
      path: /interviewPlan.list
      operations:
      - name: interviewplanlist
        method: POST
        description: interviewPlan.list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Ashby-Signature
      value: '{{env.ASHBY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ashby-interview-plan-rest
    port: 8080
    description: REST adapter for Ashby API — Interview Plan. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/interviewplan-list
      name: interviewplan-list
      description: REST surface for interviewPlan.list.
      operations:
      - method: POST
        name: interviewplanlist
        description: interviewPlan.list
        call: ashby-interview-plan.interviewplanlist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ashby-interview-plan-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ashby API — Interview Plan. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: interviewplan-list
      description: interviewPlan.list
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ashby-interview-plan.interviewplanlist
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
