naftiko: 1.0.0-alpha2
info:
  label: Ashby API — Brand
  description: 'Ashby API — Brand. 1 operations. Lead operation: brand.list. Self-contained Naftiko capability covering one
    Ashby business surface.'
  tags:
  - Ashby
  - Brand
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ASHBY_API_KEY: ASHBY_API_KEY
capability:
  consumes:
  - type: http
    namespace: ashby-brand
    baseUri: https://api.ashbyhq.com
    description: Ashby API — Brand business capability. Self-contained, no shared references.
    resources:
    - name: brand.list
      path: /brand.list
      operations:
      - name: brandlist
        method: POST
        description: brand.list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Ashby-Signature
      value: '{{env.ASHBY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ashby-brand-rest
    port: 8080
    description: REST adapter for Ashby API — Brand. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/brand-list
      name: brand-list
      description: REST surface for brand.list.
      operations:
      - method: POST
        name: brandlist
        description: brand.list
        call: ashby-brand.brandlist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ashby-brand-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ashby API — Brand. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: brand-list
      description: brand.list
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ashby-brand.brandlist
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
