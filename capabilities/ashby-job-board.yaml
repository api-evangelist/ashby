naftiko: 1.0.0-alpha2
info:
  label: Ashby API — Job Board
  description: 'Ashby API — Job Board. 1 operations. Lead operation: jobBoard.list. Self-contained Naftiko capability covering
    one Ashby business surface.'
  tags:
  - Ashby
  - Job Board
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ASHBY_API_KEY: ASHBY_API_KEY
capability:
  consumes:
  - type: http
    namespace: ashby-job-board
    baseUri: https://api.ashbyhq.com
    description: Ashby API — Job Board business capability. Self-contained, no shared references.
    resources:
    - name: jobBoard.list
      path: /jobBoard.list
      operations:
      - name: jobboardlist
        method: POST
        description: jobBoard.list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Ashby-Signature
      value: '{{env.ASHBY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ashby-job-board-rest
    port: 8080
    description: REST adapter for Ashby API — Job Board. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/jobboard-list
      name: jobboard-list
      description: REST surface for jobBoard.list.
      operations:
      - method: POST
        name: jobboardlist
        description: jobBoard.list
        call: ashby-job-board.jobboardlist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ashby-job-board-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ashby API — Job Board. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: jobboard-list
      description: jobBoard.list
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ashby-job-board.jobboardlist
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
