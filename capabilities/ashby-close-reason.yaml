    namespace: ashby-close-reason
    baseUri: https://api.ashbyhq.com
    description: Ashby API — Close Reason business capability. Self-contained, no shared references.
    resources:
    - name: closeReason.list
      path: /closeReason.list
      operations:
      - name: closereasonlist
        method: POST
        description: closeReason.list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Ashby-Signature
      value: '{{env.ASHBY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ashby-close-reason-rest
    port: 8080
    description: REST adapter for Ashby API — Close Reason. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/closereason-list
      name: closereason-list
      description: REST surface for closeReason.list.
      operations:
      - method: POST
        name: closereasonlist
        description: closeReason.list
        call: ashby-close-reason.closereasonlist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
