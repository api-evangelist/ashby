    namespace: ashby-close-reason-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ashby API — Close Reason. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: closereason-list
      description: closeReason.list
      hints:
