naftiko: 1.0.0-alpha2
info:
  label: Ashby API — Project
  description: 'Ashby API — Project. 3 operations. Lead operation: project.info. Self-contained Naftiko capability covering
    one Ashby business surface.'
  tags:
  - Ashby
  - Project
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ASHBY_API_KEY: ASHBY_API_KEY
capability:
  consumes:
  - type: http
    namespace: ashby-project
    baseUri: https://api.ashbyhq.com
    description: Ashby API — Project business capability. Self-contained, no shared references.
    resources:
    - name: project.info
      path: /project.info
      operations:
      - name: projectinfo
        method: POST
        description: project.info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: project.list
      path: /project.list
      operations:
      - name: projectlist
        method: POST
        description: project.list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: project.search
      path: /project.search
      operations:
      - name: projectsearch
        method: POST
        description: project.search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Ashby-Signature
      value: '{{env.ASHBY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ashby-project-rest
    port: 8080
    description: REST adapter for Ashby API — Project. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/project-info
      name: project-info
      description: REST surface for project.info.
      operations:
      - method: POST
        name: projectinfo
        description: project.info
        call: ashby-project.projectinfo
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/project-list
      name: project-list
      description: REST surface for project.list.
      operations:
      - method: POST
        name: projectlist
        description: project.list
        call: ashby-project.projectlist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/project-search
      name: project-search
      description: REST surface for project.search.
      operations:
      - method: POST
        name: projectsearch
        description: project.search
        call: ashby-project.projectsearch
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ashby-project-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ashby API — Project. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: project-info
      description: project.info
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ashby-project.projectinfo
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: project-list
      description: project.list
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ashby-project.projectlist
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: project-search
      description: project.search
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: ashby-project.projectsearch
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
