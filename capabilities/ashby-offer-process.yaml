naftiko: 1.0.0-alpha2
info:
  label: Ashby API — Offer Process
  description: 'Ashby API — Offer Process. 1 operations. Lead operation: offerProcess.start. Self-contained Naftiko capability
    covering one Ashby business surface.'
  tags:
  - Ashby
  - Offer Process
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ASHBY_API_KEY: ASHBY_API_KEY
capability:
  consumes:
  - type: http
    namespace: ashby-offer-process
    baseUri: https://api.ashbyhq.com
    description: Ashby API — Offer Process business capability. Self-contained, no shared references.
    resources:
    - name: offerProcess.start
      path: /offerProcess.start
      operations:
      - name: offerprocessstart
        method: POST
        description: offerProcess.start
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Ashby-Signature
      value: '{{env.ASHBY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ashby-offer-process-rest
    port: 8080
    description: REST adapter for Ashby API — Offer Process. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/offerprocess-start
      name: offerprocess-start
      description: REST surface for offerProcess.start.
      operations:
      - method: POST
        name: offerprocessstart
        description: offerProcess.start
        call: ashby-offer-process.offerprocessstart
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ashby-offer-process-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ashby API — Offer Process. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: offerprocess-start
      description: offerProcess.start
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ashby-offer-process.offerprocessstart
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
