naftiko: 1.0.0-alpha2
info:
  label: Ashby API — API Key
  description: 'Ashby API — API Key. 1 operations. Lead operation: apiKey.info. Self-contained Naftiko capability covering
    one Ashby business surface.'
  tags:
  - Ashby
  - API Key
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ASHBY_API_KEY: ASHBY_API_KEY
capability:
  consumes:
  - type: http
    namespace: ashby-api-key
    baseUri: https://api.ashbyhq.com
    description: Ashby API — API Key business capability. Self-contained, no shared references.
    resources:
    - name: apiKey.info
      path: /apiKey.info
      operations:
      - name: apikeyinfo
        method: POST
        description: apiKey.info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Ashby-Signature
      value: '{{env.ASHBY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ashby-api-key-rest
    port: 8080
    description: REST adapter for Ashby API — API Key. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/apikey-info
      name: apikey-info
      description: REST surface for apiKey.info.
      operations:
      - method: POST
        name: apikeyinfo
        description: apiKey.info
        call: ashby-api-key.apikeyinfo
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ashby-api-key-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ashby API — API Key. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: apikey-info
      description: apiKey.info
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ashby-api-key.apikeyinfo
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
