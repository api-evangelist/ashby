naftiko: 1.0.0-alpha2
info:
  label: Ashby API — Interview
  description: 'Ashby API — Interview. 2 operations. Lead operation: interview.info. Self-contained Naftiko capability covering
    one Ashby business surface.'
  tags:
  - Ashby
  - Interview
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ASHBY_API_KEY: ASHBY_API_KEY
capability:
  consumes:
  - type: http
    namespace: ashby-interview
    baseUri: https://api.ashbyhq.com
    description: Ashby API — Interview business capability. Self-contained, no shared references.
    resources:
    - name: interview.info
      path: /interview.info
      operations:
      - name: interviewinfo
        method: POST
        description: interview.info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: interview.list
      path: /interview.list
      operations:
      - name: interviewlist
        method: POST
        description: interview.list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Ashby-Signature
      value: '{{env.ASHBY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ashby-interview-rest
    port: 8080
    description: REST adapter for Ashby API — Interview. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/interview-info
      name: interview-info
      description: REST surface for interview.info.
      operations:
      - method: POST
        name: interviewinfo
        description: interview.info
        call: ashby-interview.interviewinfo
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/interview-list
      name: interview-list
      description: REST surface for interview.list.
      operations:
      - method: POST
        name: interviewlist
        description: interview.list
        call: ashby-interview.interviewlist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ashby-interview-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ashby API — Interview. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: interview-info
      description: interview.info
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ashby-interview.interviewinfo
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: interview-list
      description: interview.list
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ashby-interview.interviewlist
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
