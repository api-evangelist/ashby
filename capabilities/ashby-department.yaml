naftiko: 1.0.0-alpha2
info:
  label: Ashby API — Department
  description: 'Ashby API — Department. 2 operations. Lead operation: department.info. Self-contained Naftiko capability covering
    one Ashby business surface.'
  tags:
  - Ashby
  - Department
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ASHBY_API_KEY: ASHBY_API_KEY
capability:
  consumes:
  - type: http
    namespace: ashby-department
    baseUri: https://api.ashbyhq.com
    description: Ashby API — Department business capability. Self-contained, no shared references.
    resources:
    - name: department.info
      path: /department.info
      operations:
      - name: departmentinfo
        method: POST
        description: department.info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: department.list
      path: /department.list
      operations:
      - name: departmentlist
        method: POST
        description: department.list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Ashby-Signature
      value: '{{env.ASHBY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ashby-department-rest
    port: 8080
    description: REST adapter for Ashby API — Department. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/department-info
      name: department-info
      description: REST surface for department.info.
      operations:
      - method: POST
        name: departmentinfo
        description: department.info
        call: ashby-department.departmentinfo
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/department-list
      name: department-list
      description: REST surface for department.list.
      operations:
      - method: POST
        name: departmentlist
        description: department.list
        call: ashby-department.departmentlist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ashby-department-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ashby API — Department. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: department-info
      description: department.info
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ashby-department.departmentinfo
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: department-list
      description: department.list
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ashby-department.departmentlist
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
