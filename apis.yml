aid: ashby
url: https://raw.githubusercontent.com/api-evangelist/ashby/refs/heads/main/apis.yml
name: Ashby
kind: company
description: Ashby is an all-in-one talent strategy platform combining ATS, sourcing, scheduling, and analytics. The Ashby
  API exposes candidates, applications, jobs, openings, offers, interviews, hiring teams, surveys, custom fields, and webhooks
  for recruiting operations teams.
