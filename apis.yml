    handles, demographics, tags, and custom fields. Candidates exist independently of any single application.
- aid: ashby:ashby-applications-api
  name: Ashby Applications API
  tags:
  - Applications
  - Pipeline
  properties:
  - url: https://developers.ashbyhq.com/
    type: Documentation
  - url: openapi/ashby-api-openapi.json
    type: OpenAPI
  description: Submit applications against jobs, advance applications through stages, reject, archive, withdraw, and reactivate
    applications across the hiring pipeline.
- aid: ashby:ashby-jobs-api
  name: Ashby Jobs API
  tags:
  - Jobs
  - Postings
  properties:
  - url: https://developers.ashbyhq.com/
    type: Documentation
  - url: openapi/ashby-api-openapi.json
    type: OpenAPI
  description: Manage jobs (the recruiting concept) — title, department, employment type, status, and lifecycle — separate
    from openings (headcount slots).
- aid: ashby:ashby-openings-api
  name: Ashby Openings API
  tags:
  - Openings
  - Headcount
  properties:
  - url: https://developers.ashbyhq.com/
    type: Documentation
  - url: openapi/ashby-api-openapi.json
    type: OpenAPI
  description: Manage openings — the headcount slots associated with a job; multiple openings allow tracking parallel hires
    per requisition.
- aid: ashby:ashby-job-postings-api
  name: Ashby Job Postings API
  tags:
  - Job Postings
  - Public
  properties:
  - url: https://developers.ashbyhq.com/
    type: Documentation
  - url: openapi/ashby-api-openapi.json
    type: OpenAPI
  description: Manage public job postings (the candidate-facing job ads) and the careers-page configuration including title,
    location, description, and apply URL.
- aid: ashby:ashby-offers-api
  name: Ashby Offers API
  tags:
  - Offers
  - Approvals
  properties:
  - url: https://developers.ashbyhq.com/
    type: Documentation
  - url: openapi/ashby-api-openapi.json
    type: OpenAPI
  description: Generate offer drafts, route through approvals, and track offer versions, compensation, and acceptance status.
- aid: ashby:ashby-interviews-api
  name: Ashby Interviews API
  tags:
  - Interviews
  - Stages
  properties:
  - url: https://developers.ashbyhq.com/
    type: Documentation
  - url: openapi/ashby-api-openapi.json
    type: OpenAPI
  description: Read interview definitions configured per job stage and the per- candidate interview events generated as candidates
    progress.
- aid: ashby:ashby-interview-schedules-api
  name: Ashby Interview Schedules API
  tags:
  - Interview Schedules
  - Scheduling
  properties:
  - url: https://developers.ashbyhq.com/
    type: Documentation
  - url: openapi/ashby-api-openapi.json
    type: OpenAPI
  description: Create and manage interview schedules — the day-of itinerary linking candidates, interviewers, and time slots,
    including ad-hoc and template-driven schedules.
- aid: ashby:ashby-feedback-api
  name: Ashby Feedback API
  tags:
  - Feedback
