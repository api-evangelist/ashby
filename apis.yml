  - url: openapi/ashby-api-openapi.json
    type: OpenAPI
  - url: openapi/ashby-assessments-partner-openapi.json
    type: OpenAPI
  description: Read the structured feedback form templates (questions, rating scales, recommendation values) configured for
    the tenant.
